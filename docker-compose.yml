services:
  postgres:
    image: postgres:16-alpine
    container_name: chatgpt-creator-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acctcreator}
      POSTGRES_USER: ${POSTGRES_USER:-acctcreator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acctcreator}
    # Tuned for a 1C/1G host — postgres defaults assume vastly more RAM.
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acctcreator}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 200M

  web:
    build: .
    image: chatgpt-creator
    container_name: chatgpt-creator
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # ── Postgres (compose-internal) ────────────────────────────────────
      DATABASE_URL: postgres://${POSTGRES_USER:-acctcreator}:${POSTGRES_PASSWORD:-acctcreator}@postgres:5432/${POSTGRES_DB:-acctcreator}

      # ── Better-Auth ────────────────────────────────────────────────────
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DEV_PASSWORD_AUTH: ${DEV_PASSWORD_AUTH:-false}

      # ── OIDC SSO ───────────────────────────────────────────────────────
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}

      # ── OpenRouter (AI agent) ──────────────────────────────────────────
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-z-ai/glm-4.6v}

      # ── Burner email + IMAP poller ─────────────────────────────────────
      EMAIL_DOMAIN: ${EMAIL_DOMAIN}
      IMAP_HOST: ${IMAP_HOST:-imap.fastmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_LOOKBACK_DAYS: ${IMAP_LOOKBACK_DAYS:-1}

      # ── Browser ────────────────────────────────────────────────────────
      HEADLESS: ${HEADLESS:-true}
    restart: unless-stopped
    # Playwright/Chromium needs more shared memory than the 64M default.
    shm_size: 1gb
    volumes:
      - auth-data:/app/web/.auth-data

volumes:
  auth-data:
  pg-data:
