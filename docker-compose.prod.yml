# Production compose — pulls the published image from GHCR rather than
# building locally. Pair with `docker compose -f docker-compose.prod.yml up`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: chatgpt-creator-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acctcreator}
      POSTGRES_USER: ${POSTGRES_USER:-acctcreator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acctcreator}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acctcreator}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: ghcr.io/jsserve-org/howardsm4-openaicreateacc_automation:latest
    container_name: chatgpt-creator
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - web/.env.local
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-acctcreator}:${POSTGRES_PASSWORD:-acctcreator}@postgres:5432/${POSTGRES_DB:-acctcreator}
    restart: unless-stopped
    shm_size: 1gb
    volumes:
      - auth-data:/app/web/.auth-data

volumes:
  auth-data:
  pg-data:
